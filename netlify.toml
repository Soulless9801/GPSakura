[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "#custom"
  autoLaunch = false
  command = "npm run dev -- --host 127.0.0.1 --port 5173 --strictPort"
  targetPort = 5173
  port = 8080

[functions]
  directory = "netlify/entrypoints"
  node_bundler = "esbuild"

# Runtime imports are traced by esbuild. Only filesystem-loaded fallback data needs copying.
[functions.firebase-collection-query]
  included_files = ["netlify/functions/data/firebase*.json"]

[functions.codeforces-sheet-data]
  included_files = ["netlify/functions/data/cfProblems.csv"]
